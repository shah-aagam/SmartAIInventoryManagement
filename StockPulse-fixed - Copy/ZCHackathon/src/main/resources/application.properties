spring.application.name=StockPulse

# H2 is intentionally in-memory for the interview challenge.
spring.datasource.url=jdbc:h2:mem:stockpulse;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true

# LLM gateway (never commit the API key itself).
llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:qwen-cursor}
llm.product=${LLM_PRODUCT:PC1}
# Optional: only set this if the provided gateway actually requires the cookie.
llm.cookie=${LLM_COOKIE:}
